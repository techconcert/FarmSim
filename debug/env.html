<!doctype html>
<html><head><meta charset="utf-8"><title>Environment debug</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100vw;height:100vh;display:block}
#i{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;background:#0008;padding:4px 8px;white-space:pre}</style></head>
<body><canvas id="c"></canvas><div id="i"></div>
<script type="module">
import { createGL } from '../src/render/gl.js';
import { createWorld, initialSeed } from '../src/ecs/world.js';
import { createEnvironment } from '../src/render/environment.js';
import { buildLineup } from '../src/render/envBuild.js';
import * as M from '../src/render/mat4.js';
import { PENS } from '../src/config.js';
const errs = []; window.addEventListener('error', e => errs.push(String(e.message)));
const canvas = document.getElementById('c');
const G = createGL(canvas);
const W = createWorld({ seed: 1337 }); initialSeed(W);
const t0 = performance.now();
const env = createEnvironment(G, W);
const buildMs = performance.now() - t0;
// ?lineup : reference-style props lineup floating at y=1000 (use __env.lineupCam())
let LU = null;
if (new URLSearchParams(location.search).has('lineup')) {
  LU = buildLineup();
  G.createStaticMesh(LU.props, { outline: 0.05 }); G.createStaticMesh(LU.bldg, { outline: 0.08 }); G.createStaticMesh(LU.scatter); G.createStaticMesh(LU.trees);
}
const cam = { e: [0, 300, 260], t: [0, 0, 10], fov: 0.8, far: 2000 };
const q = new URLSearchParams(location.search);
// ?pen=N : close view of pen N (pens 0-19: 5 columns x 4 rows)
if (q.has('pen')) { const P = PENS[+q.get('pen')]; cam.e = [P.cx, 60, P.cz + 70]; cam.t = [P.cx, 0, P.cz]; }
W.hour = +(q.get('hour') ?? 12); let auto = q.has('auto');
function frame() {
  G.resize();
  if (auto) W.hour = (W.hour + 0.02) % 24;
  env.update(W, 1 / 60);
  M.perspective(G.proj, cam.fov, G.width / G.height, 0.5, cam.far);
  M.lookAt(G.view, ...cam.e, ...cam.t);
  G.camPos[0] = cam.e[0]; G.camPos[1] = cam.e[1]; G.camPos[2] = cam.e[2];
  G.render();
  document.getElementById('i').textContent = `hour ${W.hour.toFixed(1)} calls ${G.info.calls} tris ${G.info.triangles} build ${buildMs.toFixed(0)}ms trees ${env.info.treeCount}`;
  requestAnimationFrame(frame);
}
window.__env = { LU, G, W, env, cam, errs, setCam(e, t, fov) { cam.e = e; cam.t = t; if (fov) cam.fov = fov; }, setHour(h) { W.hour = h; auto = false; }, info: () => ({ calls: G.info.calls, tris: G.info.triangles, buildMs }) };
window.__ready = true;
frame();
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>outline check</title>
<style>html,body{margin:0;background:#222}canvas{width:900px;height:560px;display:block}</style></head>
<body><canvas id="c" width="900" height="560"></canvas>
<script type="module">
import { createGL } from '../src/render/gl.js';
import * as L from '../src/render/lowpoly.js';
import { perspective, lookAt, writeYPR } from '../src/render/mat4.js';
window.__oc = { done: false, error: null };
try {
  const G = createGL(document.getElementById('c'));
  G.resize();
  perspective(G.proj, 0.9, G.width / G.height, 0.5, 600);
  const cam = [6, 5, 9];
  lookAt(G.view, cam[0], cam[1], cam[2], 0, 1.0, 1.5);
  G.camPos.set(cam);
  G.createStaticMesh(L.quad(120, 120, 0x8aa65a, 0, 0, 0));
  // sharp-edged merged shape (box + cone + cylinder) and a round animal-ish one
  const sharp = L.merge([
    L.box(2, 1.2, 3, 0xc9604f, 0, 0.6, 0),
    L.cone(1.0, 1.8, 6, 0x4f7a3f, 0, 2.1, 0),
    L.cyl(0.4, 0.5, 1.4, 6, 0xe0d8c0, 0, 0.7, 2.0, 0.3, 0, 0),
  ]);
  const body = L.merge([
    L.ell(1.0, 0.8, 1.3, 0xe8e2d0, 0, 1.0, 0, 8, 4),
    L.ell(0.5, 0.45, 0.5, 0xe8e2d0, 0, 1.7, 1.2, 6, 3),
    L.rod(-0.4, 0.8, 0, -0.4, 0, 0.1, 0.12, 0.09, 0xd9a040),
    L.rod(0.4, 0.8, 0, 0.4, 0, 0.1, 0.12, 0.09, 0xd9a040),
  ]);
  const A = G.createMesh(sharp, 4, { outline: 0.26 });
  const B = G.createMesh(body, 8, { outline: true });
  writeYPR(A.inst, 0, -5, 0, 0, 0.5, 0, 0, 1, 1, 1);
  writeYPR(A.inst, 1, 6, 0, -6, 1.0, 0, 0, 0.6, 0.6, 0.6);
  A.count = 2; A.upload();
  for (let i = 0; i < 4; i++) writeYPR(B.inst, i, i * 3.2 - 3, 0, 4 - i * 2, i * 0.7, 0, 0, 1 - i * 0.15, 1 - i * 0.15, 1 - i * 0.15);
  // mirrored instance
  writeYPR(B.inst, 4, 3, 0, -3, 0.4, 0, 0, -1, 1, 1);
  B.count = 5; B.outlineMirrored = true; B.upload();
  G.render();
  const err = G.gl.getError();
  const info1 = { ...G.info };
  // perf sanity: 5000 instances with outline
  const P = G.createMesh(body, 5000, { outline: true });
  for (let i = 0; i < 5000; i++) writeYPR(P.inst, i, (i % 100) * 3 - 150, 0, -Math.floor(i / 100) * 3 - 20, i, 0, 0, 1, 1, 1);
  P.count = 5000; P.upload();
  const t0 = performance.now();
  G.render(); G.gl.finish();
  const err2 = G.gl.getError();
  P.visible = false;
  G.render();
  window.__oc = { done: true, error: (err || err2) ? 'GL error ' + err + '/' + err2 : null, info: info1, info5000: { ...G.info }, ms5000: performance.now() - t0 };
} catch (e) {
  window.__oc = { done: true, error: String(e && e.stack || e) };
}
</script></body></html>
